<nav class="nav-bar">
  <div class="nav-header">
    <a class="nav-logo" routerLink="/">{{ nav.logo.text }}</a>
    @if (!isLargeScreen) {
      <app-hamburger (pressed)="toggleSidebar()" />
    }
  </div>
  @if (showLinks) {
    <ul class="nav-links">
      @for (link of nav.links; track link.label) {
        <li>
          <a
            [routerLink]="link.url"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.url === '/' }"
            (click)="closeSidebarOnNavigation()"
            >{{ link.label }}</a
          >
        </li>
      }
    </ul>
  }
  <div class="nav-actions">
    <a
      class="nav-call"
      [href]="phoneHref"
      [attr.aria-label]="'Call Groove Kitchens on ' + phoneNumber"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M7.2 3.5 5.5 4.8c-.9.7-1.2 1.9-.7 2.9 2.3 5 6.5 9.2 11.5 11.5 1 .5 2.2.2 2.9-.7l1.3-1.7-3.3-3.3-2.1 1.3c-1.8-.9-3.3-2.4-4.2-4.2l1.3-2.1-3.7-3.7Z"
        />
      </svg>
      <span class="nav-call-copy">
        <span class="nav-call-label">Call me</span>
        <span class="nav-call-number">{{ phoneNumber }}</span>
      </span>
    </a>
    <a class="nav-cta" routerLink="/contact">{{ nav.cta.label }}</a>
  </div>
</nav>
