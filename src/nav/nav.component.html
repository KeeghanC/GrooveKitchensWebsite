<nav class="nav-bar">
  <div class="nav-header">
    <a class="nav-logo" routerLink="/">{{ nav.logo.text }}</a>
    @if (!isLargeScreen) {
      <app-hamburger (pressed)="toggleSidebar()" />
    }
  </div>
  @if (showLinks) {
    <ul class="nav-links">
      @for (link of nav.links; track link.label) {
        <li>
          <a
            [routerLink]="link.url"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.url === '/' }"
            (click)="closeSidebarOnNavigation()"
            >{{ link.label }}</a
          >
        </li>
      }
    </ul>
  }
  <a class="nav-cta" routerLink="/contact">{{ nav.cta.label }}</a>
</nav>
