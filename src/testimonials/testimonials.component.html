<div class="container">
  <div class="mb-1">
    <h1>Testimonials</h1>
  </div>

  <div class="carousel-container">
    <button class="nav-btn left" type="button" aria-label="Previous testimonial" (click)="prev()">
      ‹
    </button>

    <div class="testimonial-card">
      <p class="text">“{{ testimonials[currentIndex].text }}”</p>
      <h4 class="person">{{ testimonials[currentIndex].person }}</h4>
      <a
        class="review-source"
        [href]="testimonials[currentIndex].sourceUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        Read all verified reviews on NoCowboys
      </a>
    </div>

    <button class="nav-btn right" type="button" aria-label="Next testimonial" (click)="next()">
      ›
    </button>
  </div>

  <div class="progress-bar">
    <div class="progress" [style.width.%]="(timeElapsed / interval) * 100"></div>
  </div>
</div>
