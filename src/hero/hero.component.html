<section class="hero">
  <div class="hero-content">
    <h1 class="hero-title">{{ hero.title }}</h1>
    <p class="hero-subtitle">{{ hero.subtitle }}</p>
    <a class="cta-button" [routerLink]="hero.ctaLink">{{ hero.ctaText }}</a>
  </div>
  <div class="hero-visual">
    <img
      src="assets/hero-kitchen.webp"
      alt="Contemporary kitchen with a stone island overlooking the coast"
    />
  </div>
</section>
